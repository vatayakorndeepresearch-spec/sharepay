<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<title>SharePay</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/favicon-32.png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<!-- Body and Thai text at their default weight: everything else can arrive late. -->
		<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400-latin.woff2" crossorigin>
		<link rel="preload" as="font" type="font/woff2" href="/fonts/noto-sans-thai-400-thai.woff2" crossorigin>
		<script>
			// Resolve the theme before first paint so dark mode never flashes light.
			(() => {
				try {
					const stored = localStorage.getItem('sharepay:theme');
					document.documentElement.dataset.theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
				} catch {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
